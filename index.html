<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Tower of Dove Music Studio</title>
  <meta name="theme-color" content="#0B0B0D">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Book a rehearsal room and rent studio gear. Four rooms, open daily 10 AM to 10 PM. No account needed to book.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tower of Dove">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- Link previews (Facebook, Messenger, Viber...): og:image must be a full web address (the live site: https://tower-of-dove.vercel.app).
       Change it here if the site moves to another domain. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tower-of-dove.vercel.app/">
  <link rel="canonical" href="https://tower-of-dove.vercel.app/">
  <meta property="og:site_name" content="Tower of Dove Music Studio">
  <meta property="og:title" content="Tower of Dove Music Studio">
  <meta property="og:description" content="Book a rehearsal room and rent studio gear. Four rooms, open daily 10 AM to 10 PM. No account needed to book.">
  <meta property="og:image" content="https://tower-of-dove.vercel.app/assets/img/og-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tower of Dove Music Studio">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tower of Dove Music Studio">
  <meta name="twitter:description" content="Book a rehearsal room and rent studio gear. Four rooms, open daily 10 AM to 10 PM. No account needed to book.">
  <meta name="twitter:image" content="https://tower-of-dove.vercel.app/assets/img/og-cover.png">
  <script src="js/shared/themeInit.js"></script>

  <!-- Home, Book, Rent, My Bookings, My Rental and Contact Us are tabs of one page: pages/customer.html.
       This file only forwards old links (index.html, index.html#contact) to it. -->
  <meta http-equiv="refresh" content="0;url=pages/customer.html#home">
  <script>
    (function () {
      var h = location.hash === '#contact' ? '#contact' : '#home';
      location.replace('pages/customer.html' + location.search + h);
    })();
  </script>
</head>
<body></body>
</html>
