<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in | Tower of Dove Music Studio</title>
  <link rel="icon" type="image/png" href="../assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-active="">

  <!-- The sidebar and mobile bar are injected by shared.js -->
  <main class="page" id="auth">
    <div class="card login">
      <img class="logo-lg" src="../assets/img/logo.png" alt="Tower of Dove logo">

      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-at="login" class="on" aria-selected="true">Log in</button>
        <button type="button" role="tab" data-at="register" aria-selected="false">Register</button>
      </div>

      <!-- Log in -->
      <form id="f-login" novalidate>
        <h1>Welcome back</h1>
        <p class="sub">Log in to see your bookings and rentals.</p>

        <label for="lu">Username</label>
        <input id="lu" autocomplete="username">
        <label for="lp">Password</label>
        <input id="lp" type="password" autocomplete="current-password">

        <div class="alert" id="login-err" hidden></div>
        <button class="btn gold full" type="submit">Log in</button>
        <p class="mut" style="margin-top:12px"><button type="button" class="lk" id="forgot">Forgot password?</button></p>
      </form>

      <!-- Register -->
      <form id="f-reg" hidden novalidate>
        <h1>Create your account</h1>
        <p class="sub">Keep every booking and rental in one place.</p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div><label for="rg-fn">First name</label><input id="rg-fn" autocomplete="given-name"></div>
          <div><label for="rg-ln">Last name</label><input id="rg-ln" autocomplete="family-name"></div>
        </div>
        <label for="rg-phone">Phone number</label>
        <input id="rg-phone" placeholder="09XX XXX XXXX" autocomplete="tel">
        <label for="rg-user">Username</label>
        <input id="rg-user" autocomplete="username">
        <label for="rg-pass">Password</label>
        <input id="rg-pass" type="password" autocomplete="new-password">
        <label for="rg-pass2">Confirm password</label>
        <input id="rg-pass2" type="password" autocomplete="new-password">

        <div class="alert" id="reg-err" hidden></div>
        <button class="btn gold full" type="submit">Create account</button>
      </form>

      <p class="mut login-foot">Only booking once? <button type="button" class="lk" id="guest">Continue as guest</button>. You get a booking reference to look it up later.</p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/shared.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
