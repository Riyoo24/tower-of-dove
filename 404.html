<style>
:root{color-scheme:dark;--bg:#0B0B0D;--ink:#F4F1EE;--mut:#A3A1AD;--brand:#B3202F;--line:#2E2E35}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.5 'Instrument Sans',system-ui,sans-serif;text-align:center}
main{max-width:460px}
img{width:72px;height:72px;border-radius:50%;margin-bottom:18px}
.code{font:700 72px/1 'Bricolage Grotesque',Georgia,serif;color:var(--brand);letter-spacing:-.02em}
h1{font:700 26px/1.2 'Bricolage Grotesque',Georgia,serif;margin:10px 0 8px}
p{color:var(--mut)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
a.go{background:var(--brand);border-color:var(--brand);color:#fff}
a:focus-visible{outline:2px solid #FF6B78;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){main{animation:in .4s ease-out both}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
